services:
  - type: web
    name: schemeai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_SECONDARY_PIN
        value: "7788"
      - key: PYTHON_VERSION
        value: 3.11.9
